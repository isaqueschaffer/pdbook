# PDBook — production stack for a single OCI Ampere A1 VM (ARM64), database on Neon.
#
#   docker compose up -d --build
#
# Only Caddy publishes ports (80/443). The API and the worker publish none (they only make outbound
# connections to Neon); Redis is on an internal-only network with no internet route at all.
# Memory limits are sized for a 12 GB A1.Flex; adjust in .env (see README "Ajuste de limites").

name: pdbook

x-app: &app
  build:
    context: ./backend
  image: pdbook-backend:latest
  env_file: ${ENV_FILE:-.env}
  restart: unless-stopped
  volumes:
    - ${DATA_DIR:-./data}:/data
  depends_on:
    redis:
      condition: service_healthy
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  backend:
    <<: *app
    command:
      - sh
      - -c
      - >-
        if [ "$${RUN_MIGRATIONS_ON_START:-false}" = "true" ]; then alembic upgrade head; fi &&
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers $${API_WORKERS:-2}
        --proxy-headers --forwarded-allow-ips '*' --no-access-log
    # internal: Redis + Caddy; egress: outbound access to Neon (no ports are published).
    networks: [internal, egress]
    mem_limit: ${API_MEM_LIMIT:-1g}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    <<: *app
    command: ["python", "worker.py"]
    # internal: Redis; egress: outbound access to Neon (no ports are published).
    networks: [internal, egress]
    # Hard ceiling for the container; each job is also capped by WORKER_MEMORY_LIMIT_MB.
    mem_limit: ${WORKER_MEM_LIMIT:-3g}
    cpus: ${WORKER_CPUS:-1.5}
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "python", "worker.py", "--check"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      - sh
      - -c
      - >-
        exec redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 128mb --maxmemory-policy noeviction
        --appendonly yes --save 300 10 --protected-mode yes
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env}
    volumes:
      - redis-data:/data
    networks: [internal]
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    # No "ports:" on purpose — Redis is reachable only from the internal network.

  caddy:
    build:
      context: .
      dockerfile: caddy/Dockerfile
    image: pdbook-caddy:latest
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
      MAX_REQUEST_BODY: ${MAX_REQUEST_BODY:-52MB}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks: [internal, egress]
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 256m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

networks:
  # Redis lives only here: no route to the internet and unreachable from outside the host.
  internal:
    internal: true
  # Outbound traffic (Neon, Let's Encrypt). Only Caddy publishes ports on this network.
  egress: {}

volumes:
  redis-data:
  caddy-data:
  caddy-config:
